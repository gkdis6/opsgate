name: Fuzz
# Seeds run on every push as ordinary tests. This job explores further, one
# target at a time, and keeps any failing input as an artifact.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per target
        default: 2m
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - name: Fuzz every target
        env:
          FUZZTIME: ${{ inputs.fuzztime || '2m' }}
        run: |
          status=0
          for file in $(grep -rl --include='*_test.go' '^func Fuzz' internal); do
            dir=$(dirname "$file")
            for target in $(grep -o '^func Fuzz[A-Za-z0-9_]*' "$file" | cut -d' ' -f2); do
              echo "::group::$dir $target"
              go test "./$dir" -run '^$' -fuzz "^$target\$" -fuzztime "$FUZZTIME" || status=1
              echo "::endgroup::"
            done
          done
          exit $status
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: internal/**/testdata/fuzz
