<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 942" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How opsgate works</title>
<desc id="desc">MCP clients use local stdio or HTTPS through a TLS reverse proxy. opsgate checks identity, scopes and policy, wraps tools with plan/approval/apply, masks and limits results, and writes JSONL audit events. Kubernetes, notes and a separate dev runner are bounded by OS accounts and RBAC. There is no shell tool.</desc>
<style>
svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 14px; }
text { fill: #202936; }
.title { font-size: 21px; font-weight: 700; }
.head { font-size: 16px; font-weight: 650; }
.small { font-size: 13px; }
.muted { fill: #526071; }
.box { fill: #f6f8fa; stroke: #aab5c2; stroke-width: 1.3; }
.accent { fill: #edf4ff; stroke: #5886c0; stroke-width: 1.4; }
.good { fill: #eef8f0; stroke: #639974; stroke-width: 1.4; }
.bad { fill: #fff1f0; stroke: #bc6664; stroke-width: 1.4; }
.boundary { fill: none; stroke: #8895a5; stroke-width: 1.3; stroke-dasharray: 6 5; }
.line { fill: none; stroke: #66768a; stroke-width: 1.5; marker-end: url(#arrow); }
.return { stroke-dasharray: 4 4; }
.allow { stroke: #398253; marker-end: url(#allow); }
.deny { stroke: #b44848; marker-end: url(#deny); }
.arrow { fill: #66768a; }
.allow-tip { fill: #398253; }
.deny-tip { fill: #b44848; }
@media (prefers-color-scheme: dark) {
 text { fill: #e5eaf1; }
 .muted { fill: #b3bfd0; }
 .box { fill: #202833; stroke: #64748b; }
 .accent { fill: #1a304c; stroke: #79a4df; }
 .good { fill: #183427; stroke: #77b68b; }
 .bad { fill: #3c2428; stroke: #d48989; }
 .boundary { stroke: #98a7bb; }
 .line { stroke: #a2b1c5; }
 .allow { stroke: #8bc99e; }
 .deny { stroke: #eda0a0; }
 .arrow { fill: #a2b1c5; }
 .allow-tip { fill: #8bc99e; }
 .deny-tip { fill: #eda0a0; }
}
</style>
<defs>
 <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 8 4 0 8Z"/></marker>
 <marker id="allow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="allow-tip" d="M0 0 8 4 0 8Z"/></marker>
 <marker id="deny" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="deny-tip" d="M0 0 8 4 0 8Z"/></marker>
</defs>
<text x="24" y="30" class="title">Operations through explicit tools</text>
<rect x="24" y="54" width="374" height="74" rx="9" class="box"/>
<text x="40" y="81" class="head">Local MCP clients</text>
<text x="40" y="107">Claude Code / Cursor</text>
<rect x="432" y="54" width="374" height="74" rx="9" class="box"/>
<text x="448" y="81" class="head">Remote MCP clients</text>
<text x="448" y="107">claude.ai / ChatGPT connectors</text>
<path d="M211 128 V154" class="line "/>
<path d="M619 128 V154" class="line "/>
<rect x="24" y="154" width="374" height="62" rx="9" class="box"/>
<text x="40" y="178" class="head">stdio · local process</text>
<text x="40" y="200" class="small">Configured identity + scopes; no login</text>
<rect x="432" y="154" width="374" height="62" rx="9" class="box"/>
<text x="448" y="178" class="head">HTTPS → TLS reverse proxy</text>
<text x="448" y="200" class="small">→ plain HTTP listener (/mcp)</text>
<path d="M211 216 V232 H414 V280" class="line "/>
<path d="M619 216 V232 H438 V280" class="line "/>
<rect x="12" y="246" width="806" height="550" rx="9" class="boundary"/>
<text x="28" y="270" class="small muted">Trust boundary: server OS account / Kubernetes RBAC</text>
<rect x="32" y="280" width="448" height="474" rx="9" class="accent"/>
<text x="48" y="307" class="head">opsgate</text>
<text x="464" y="307" class="small" text-anchor="end">No shell tool</text>
<rect x="48" y="322" width="416" height="84" rx="9" class="box"/>
<text x="64" y="346" class="head">1  Authenticate (HTTP)</text>
<text x="64" y="369" class="small">Built-in OAuth: passkey / GitHub / OIDC</text>
<text x="64" y="390" class="small">or external JWT / static token</text>
<path d="M256 406 V418" class="line "/>
<rect x="48" y="418" width="416" height="48" rx="9" class="box"/>
<text x="64" y="447" class="head">2  Scope + server / user tool policy</text>
<path d="M256 466 V478" class="line "/>
<rect x="48" y="478" width="416" height="140" rx="9" class="box"/>
<text x="64" y="502" class="head">3  Tool wrapper</text>
<text x="64" y="526" class="small">Reads: handler · writes: Plan → approval → Apply</text>
<rect x="64" y="544" width="94" height="38" rx="9" class="good"/>
<text x="111.0" y="568" class="small" text-anchor="middle">Plan</text>
<rect x="184" y="544" width="148" height="38" rx="9" class="good"/>
<text x="258.0" y="568" class="small" text-anchor="middle">Human approval</text>
<rect x="358" y="544" width="90" height="38" rx="9" class="good"/>
<text x="403.0" y="568" class="small" text-anchor="middle">Apply</text>
<path d="M158 563 H184" class="line allow"/>
<path d="M332 563 H358" class="line allow"/>
<text x="64" y="602" class="small muted">Provider allowlists + target validation</text>
<rect x="48" y="632" width="416" height="48" rx="9" class="box"/>
<text x="64" y="662" class="head">4  Redact + size-limit output</text>
<path d="M256 680 V692" class="line "/>
<rect x="48" y="692" width="416" height="48" rx="9" class="box"/>
<text x="64" y="722" class="head">5  JSONL audit log</text>
<text x="536" y="411" class="head">Enabled providers</text>
<rect x="536" y="428" width="250" height="84" rx="9" class="box"/>
<text x="552" y="453" class="head">Kubernetes</text>
<text x="552" y="477" class="small">RBAC-limited service account</text>
<rect x="536" y="534" width="250" height="84" rx="9" class="box"/>
<text x="552" y="559" class="head">Note</text>
<text x="552" y="583" class="small">Markdown folder</text>
<text x="552" y="604" class="small">Runbooks + incident memory</text>
<rect x="536" y="640" width="250" height="68" rx="9" class="box"/>
<text x="552" y="665" class="head">Dev</text>
<text x="552" y="689" class="small">Configured projects / agents</text>
<path d="M464 510 H504 V470 H536" class="line "/>
<path d="M504 510 V576 H536" class="line "/>
<path d="M504 576 V674 H536" class="line "/>
<path d="M786 470 H804 V674" class="line return"/>
<path d="M786 576 H804 V674" class="line return"/>
<path d="M786 674 H804 V774 H492 V656 H464" class="line return"/>
<text x="298" y="777" class="small muted">Dashed arrows: results</text>
<path d="M661 708 V830" class="line "/>
<text x="678" y="812" class="small">Unix socket</text>
<rect x="526" y="830" width="292" height="98" rx="9" class="boundary"/>
<text x="542" y="852" class="small muted">Trust boundary: separate runner account</text>
<text x="542" y="879" class="head">dev-runner</text>
<text x="542" y="905">→ Git worktree + coding agent</text>
<text x="32" y="846" class="small muted">One transport per process.</text>
<text x="32" y="869" class="small muted">Providers and writes must be enabled.</text>
<text x="32" y="892" class="small muted">Permissions still constrain approved actions.</text>
</svg>
