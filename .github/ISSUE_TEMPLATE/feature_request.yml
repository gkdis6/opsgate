name: Feature request
description: Suggest an improvement to opsgate.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the need and who it affects. Remove sensitive information.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include relevant permissions, approval needs and security considerations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
