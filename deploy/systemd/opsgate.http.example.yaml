# Read-only HTTP starting point. Replace placeholders and provision credentials.
# See opsgate.example.yaml for all settings; write opt-ins are commented below.
server:
  name: opsgate
  audit_log: /var/log/opsgate/audit.jsonl
  max_output_bytes: 65536
  tool_timeout: 30s
http:
  listen: 127.0.0.1:8787
  public_url: https://mcp.example.com
auth:
  mode: builtin
  builtin:
    state_file: /var/lib/opsgate/oauth.json
    access_token_ttl: 1h
    refresh_token_ttl: 720h
    max_clients: 25
    allowed_redirect_hosts: [] # Set reviewed exact hosts before public exposure.
    unknown_redirect_hosts: deny # Empty host list accepts any otherwise valid host.
    admins: [] # Allowed user subjects; required if unknown hosts need approval.
    notify_url: "" # Optional pending-client JSON POST.
    upstream:
      provider: oidc
      issuer: https://accounts.google.com
      client_id: REPLACE_WITH_GOOGLE_CLIENT_ID
      client_secret_file: /etc/opsgate/google-client-secret
    users:
      - subject: email:operator@example.com
        scopes: [ops:read]
        tools: [] # Optional tool-name globs; empty adds no limit.
approval:
  ttl: 10m
  web: true
  require_web: false
  window: 0s
  window_tools: [] # Never include dev_task_start.
providers:
  host:
    enabled: true
    units: [myapp.service]
    disk_paths: [/]
    max_log_lines: 200
    restart_units: []
    command_prefix: []
  kubernetes:
    enabled: true
    kubeconfig: /etc/opsgate/kubeconfig
    context: opsgate
    namespaces: [apps]
    deny_namespaces: [kube-system, kube-public, kube-node-lease, opsgate]
    allow_logs: true
    show_configmap_data: false
    max_log_lines: 200
    rollout_restart: []
    scale: []
    delete_pod: []
    max_replicas: 3
  note:
    enabled: false # Optional experimental vault provider.
    allow_write: false
  dev:
    enabled: false # Optional experimental coding tasks; separate runner required.

# ---- OPTIONAL WRITE OPT-INS (merge into the existing sections) ----
# Grant selected users ops:read + ops:write, then enable only exact target actions:
# providers:
#   host:
#     restart_units: [myapp.service]
#     command_prefix: [/usr/bin/sudo, -n]
#   kubernetes:
#     rollout_restart: [apps/myapp]
#     scale: [apps/myapp]
# Host restarts need the exact sudoers rule and systemd drop-in in docs/deploy.md.
# Kubernetes writes need narrowly scoped RBAC. Keep approval windows off by default.
# approval:
#   require_web: true # With web=true: require browser confirmation, deny stdio writes.
