# Reference deployment. Supply the image containing /opsgate-analyzer and
# /opsgate, configs and Secrets described in docs/analyzer.md before scaling up.
# No public ingress or Service for the loopback MCP port.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opsgate-analyzer
  namespace: opsgate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opsgate-analyzer-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opsgate-readonly
subjects:
  - kind: ServiceAccount
    name: opsgate-analyzer
    namespace: opsgate
---
apiVersion: v1
kind: Service
metadata:
  name: opsgate-analyzer
  namespace: opsgate
spec:
  selector:
    app: opsgate-analyzer
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsgate-analyzer
  namespace: opsgate
spec:
  replicas: 0 # Set to 1 after supplying credentials, model and reader config.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opsgate-analyzer
  template:
    metadata:
      labels:
        app: opsgate-analyzer
    spec:
      serviceAccountName: opsgate-analyzer
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analyzer
          image: ghcr.io/gkdis6/opsgate:v0.5.0 # Replace with a verified release tag AND its digest.
          command: [/opsgate-analyzer, -config, /etc/analyzer/analyzer.yaml]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/analyzer
              readOnly: true
            - name: credentials
              mountPath: /etc/analyzer-credentials
              readOnly: true
            - name: discord
              mountPath: /etc/analyzer-discord
              readOnly: true
        - name: reader
          image: ghcr.io/gkdis6/opsgate:v0.5.0 # Same pinned release as analyzer.
          command: [/opsgate, -transport, http, -config, /etc/reader/reader.yaml]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/reader
              readOnly: true
            - name: reader-api-credentials
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: reader-api-credentials
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        - name: config
          configMap:
            name: opsgate-analyzer
            defaultMode: 0444
        - name: credentials
          secret:
            secretName: opsgate-analyzer
            defaultMode: 0440
        - name: discord
          secret:
            secretName: opsgate-watch-discord
            defaultMode: 0440
