name: Bug report
description: Report an opsgate bug. Report vulnerabilities privately using the security link.
body:
  - type: input
    id: version
    attributes:
      label: opsgate version
      description: Include the version or commit used.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - kubernetes
        - stdio
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      description: Client name and version.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration with secrets removed
      description: Include relevant settings with tokens, secrets and private hostnames removed.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized errors or logs if useful.
    validations:
      required: true
  - type: checkboxes
    id: sanitized
    attributes:
      label: Sensitive information
      options:
        - label: I removed tokens, secrets and private hostnames
          required: true
