name: Release
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6 # TODO pin
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -race ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - uses: sigstore/cosign-installer@v3 # TODO pin
      - uses: anchore/sbom-action/download-syft@v0 # TODO pin
      - uses: docker/setup-qemu-action@v3 # TODO pin
      - uses: docker/setup-buildx-action@v3 # TODO pin
      - uses: docker/login-action@v3 # TODO pin
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GoReleaser signs checksums with a Sigstore bundle and signs image digests.
      - uses: goreleaser/goreleaser-action@v6 # TODO pin
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v3 # TODO pin
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
