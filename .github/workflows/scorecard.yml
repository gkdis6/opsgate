name: Scorecard
on:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
permissions: {}
jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2 # TODO pin to SHA
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4 # TODO pin to SHA
        with:
          sarif_file: results.sarif
