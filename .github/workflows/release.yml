name: Release
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - run: sh scripts/check-pins.sh
      - run: go test -race ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.18.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: tonistiigi/binfmt:qemu-v8.1.5@sha256:2d2918e86e5327d0661f7083d67a95280b0f7be8f77ed79a8418f81d7d90ce6f
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.29.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GoReleaser signs checksums with a Sigstore bundle and signs image digests.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this, a commit tagged both v1.2.3-rc.1 and v1.2.3 can be released as the rc.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/checksums.txt
      # List the release in the official MCP Registry (and the directories that
      # mirror it). Prereleases stay out. The image label proves ownership.
      - name: Publish to the MCP Registry
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/$archive"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive.sigstore.json" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/$archive.sigstore.json"
          cosign verify-blob --bundle "$RUNNER_TEMP/$archive.sigstore.json" \
            --certificate-identity https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/v1.8.8 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$RUNNER_TEMP/$archive"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher
          jq --arg v "${TAG#v}" --arg image "ghcr.io/gkdis6/opsgate:${TAG}" \
            '.version = $v | .packages[0].identifier = $image' server.json > "$RUNNER_TEMP/server.json"
          cd "$RUNNER_TEMP"
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
