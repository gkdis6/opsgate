apiVersion: v1
kind: Namespace
metadata:
  name: opsgate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opsgate
  namespace: opsgate
data:
  opsgate.yaml: |
    # `opsgate init` writes a file like this one. The mode
    # serves HTTP on 0.0.0.0:8787 with builtin sign-in, keeps its state in
    # /var/lib/opsgate, uses the pod's ServiceAccount and audits to stderr.
    # Print every effective value with `opsgate config show -config <file>`.
    mode: kubernetes
    http:
      public_url: https://mcp.example.com
    auth:
      builtin:
        upstream:
          provider: oidc
          issuer: https://accounts.google.com
          client_id: REPLACE_WITH_GOOGLE_CLIENT_ID
          client_secret_file: /etc/opsgate/upstream/client-secret
        users:
          - subject: email:operator@example.com
            scopes: [ops:read]
    providers:
      kubernetes:
        namespaces: [apps]
        deny_namespaces: [kube-system, kube-public, kube-node-lease, opsgate]
        allow_logs: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opsgate-state
  namespace: opsgate
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsgate
  namespace: opsgate
spec:
  replicas: 1
  # Only one process may own the OAuth state file.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opsgate
  template:
    metadata:
      labels:
        app: opsgate
    spec:
      serviceAccountName: opsgate # Defined in rbac-readonly.yaml.
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opsgate
          # Replace with a verified release tag AND its immutable manifest digest.
          image: ghcr.io/gkdis6/opsgate:v0.2.0
          imagePullPolicy: Always
          args: [-transport, http, -config, /etc/opsgate/opsgate.yaml]
          ports:
            - name: http
              containerPort: 8787
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{name: Host, value: mcp.example.com}]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{name: Host, value: mcp.example.com}]
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{name: Host, value: mcp.example.com}]
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/opsgate/opsgate.yaml
              subPath: opsgate.yaml
              readOnly: true
            - name: upstream-secret
              mountPath: /etc/opsgate/upstream
              readOnly: true
            - name: state
              mountPath: /var/lib/opsgate
      volumes:
        - name: config
          configMap:
            name: opsgate
            defaultMode: 0444
        - name: upstream-secret
          secret:
            secretName: opsgate-upstream
            defaultMode: 0440
            items:
              - key: client-secret
                path: client-secret
        - name: state
          persistentVolumeClaim:
            claimName: opsgate-state
---
apiVersion: v1
kind: Service
metadata:
  name: opsgate
  namespace: opsgate
spec:
  type: ClusterIP
  selector:
    app: opsgate
  ports:
    - name: http
      port: 8787
      targetPort: http
